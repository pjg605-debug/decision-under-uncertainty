name: Submit pending case narratives

on:
  # A push adding/updating a narrative draft (not the processed/ archive)
  # triggers submission automatically. The archive commit this workflow
  # makes on success carries "[skip ci]", so it never re-triggers itself.
  push:
    branches: [claude/decision-uncertainty-case-selection-9q6h5y]
    paths:
      - 'content/pending-narratives/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submit-pending-narratives
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit and verify each pending narrative
        id: submit
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_INSIGHT_WEBHOOK_URL: ${{ secrets.SLACK_INSIGHT_WEBHOOK_URL }}
        run: node scripts/submit-pending-narratives.mjs
      - name: Commit archived narrative files
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain content/pending-narratives)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/pending-narratives
            git commit -m "Archive submitted narrative draft(s) [skip ci]"
            git push
          else
            echo "No draft files were moved; nothing to commit."
          fi
