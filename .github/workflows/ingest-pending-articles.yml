name: Ingest pending article drafts

on:
  # A push adding/updating a draft JSON file (not the processed/ archive)
  # triggers ingestion automatically. The archive commit this workflow
  # makes on success carries "[skip ci]", so it never re-triggers itself.
  push:
    branches: [main]
    paths:
      - 'content/pending-articles/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-pending-articles
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ingest and verify each pending draft
        id: ingest
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest-pending-articles.mjs
      - name: Commit archived draft files
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain content/pending-articles)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/pending-articles
            git commit -m "Archive ingested article draft(s) [skip ci]"
            git push
          else
            echo "No draft files were moved; nothing to commit."
          fi
