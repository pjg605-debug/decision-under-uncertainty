name: Publish one judgment-training article

on:
  # Temporarily disabled: every scheduled run has failed (4/4, see runs
  # 33476286325, 33505993847, 33541721919, 33574101284). Root cause per
  # user diagnosis: supabase/functions/publish-next-article's
  # getServiceKey() can return a new-style sb_secret_ key while the
  # function still sends it via `Authorization: Bearer`, which Supabase's
  # gateway rejects as an invalid JWT for that key format. Re-enable the
  # `schedule:` trigger below once the key-compat fix (planned as a
  # separate step) is deployed and a manual workflow_dispatch run
  # succeeds end-to-end.
  # schedule:
  #   - cron: '0 3,9,15,21 * * *'
  #     timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-judgment-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the oldest queued draft
        env:
          PUBLISH_URL: https://fnxbilbihakhqvxjmoqo.supabase.co/functions/v1/publish-next-article
          PUBLISH_SECRET: ${{ secrets.GITHUB_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "x-publish-secret: $PUBLISH_SECRET" \
            --data '{}' \
            "$PUBLISH_URL")"
          cat "$response_file"
          test "$status" -ge 200
          test "$status" -lt 300
